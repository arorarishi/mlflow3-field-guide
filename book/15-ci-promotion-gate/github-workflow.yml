# Example only. Copy to .github/workflows/model-gate.yml in a repo that has these files.
# Needs repository secrets MLFLOW_TRACKING_URI (and MLFLOW_TRACKING_USERNAME/PASSWORD if
# the server uses basic auth, see chapter 24).
name: model-gate
on:
  workflow_dispatch:
  push:
    paths: ["book/15-ci-promotion-gate/**"]

jobs:
  train-and-gate:
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Train a candidate and tag it @challenger
        run: python book/15-ci-promotion-gate/example.py --train-only
      - name: Gate (fails the job if the challenger is not better)
        run: python book/15-ci-promotion-gate/gate.py --model book-gated-classifier --min-f1 0.9
